version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=accessibility-audit-secret-2026
      - DATABASE_URL=mysql+pymysql://audituser:auditpass@db:3306/accessibility_db
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: accessibility_db
      MYSQL_USER: audituser
      MYSQL_PASSWORD: auditpass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
